<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 200">
    <defs>
        <pattern id="bulbs" width="5" height="5" patternUnits="userSpaceOnUse">
            <circle cx="2.5" cy="2.5" r="1.75" fill="#fff"/>
        </pattern>
        <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="1.5" result="blur"/>
            <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
    </defs>
    <g transform="translate(22 18) rotate(-5 155 80) skewX(-5)">
        <rect x="0" y="0" width="310" height="160" rx="8" fill="#07101b" stroke="#8195a8" stroke-width="5"/>
        <rect x="9" y="9" width="292" height="142" rx="3" fill="#102337" stroke="#456783" stroke-width="2"/>
        <text x="78" y="47" fill="#fff" font-family="Arial, sans-serif" font-size="19" font-weight="700" text-anchor="middle" letter-spacing="2">HOME</text>
        <text x="230" y="47" fill="#fff" font-family="Arial, sans-serif" font-size="19" font-weight="700" text-anchor="middle" letter-spacing="2">VISITOR</text>
        <rect x="18" y="58" width="127" height="77" rx="3" fill="#030810"/>
        <rect x="165" y="58" width="127" height="77" rx="3" fill="#030810"/>
        <g fill="url(#bulbs)" filter="url(#glow)" font-family="Arial, sans-serif" font-size="64" font-weight="900" text-anchor="middle">
            <text x="81.5" y="119" textLength="111" lengthAdjust="spacingAndGlyphs">109</text>
            <text x="228.5" y="119" textLength="75" lengthAdjust="spacingAndGlyphs">98</text>
        </g>
    </g>
</svg>
